<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTAS - Mikrofon</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#071B32;color:#fff;font-family:Inter,system-ui,sans-serif;padding:16px;text-align:center}
#orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#21C7D9,#087CA7 60%,#071B32);box-shadow:0 0 40px rgba(33,199,217,.45)}
#orb.on{animation:p .7s ease-in-out infinite}@keyframes p{50%{transform:scale(1.15)}}
#msg{min-height:24px;color:#9FB6C9}#txt{font-size:20px;min-height:30px}
button{font:inherit;border:0;border-radius:999px;padding:12px 22px;background:#21C7D9;color:#071B32;cursor:pointer;display:none}
</style></head><body>
<div id="orb"></div><div id="txt"></div><div id="msg">Menyiapkan mikrofon…</div>
<button id="fin">Selesai bicara</button><button id="again">Coba lagi</button>
<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SILENCE_MS=2500, FIRST_MS=9000, MAX_MS=60000; // jeda diam sebelum dianggap selesai
// Android mengirim hasil bertahap berulang ('ya', 'ya benar', 'ya benar 300'). Gabungkan tanpa duplikat.
function merge(list){
  const seg=[];
  for(const raw of list){
    const t=String(raw).trim();if(!t)continue;const lt=t.toLowerCase();let skip=false,cut=-1;
    for(let k=seg.length-1;k>=0;k--){const s=seg[k].toLowerCase();
      if(s===lt||s.startsWith(lt)){skip=true;break;}
      if(lt.startsWith(s)){cut=k;break;}}
    if(skip)continue;
    if(cut>=0)seg.length=cut;
    seg.push(t);
  }
  return seg.join(' ');
}
function send(text,error){try{if(window.opener)window.opener.postMessage({type:'astas-speech',text:text||'',error:error||''},'*');}catch(e){}}
function start(){
  $('again').style.display='none';$('fin').style.display='none';$('txt').textContent='';
  if(!window.opener){$('msg').textContent='Halaman ini harus dibuka dari tombol mikrofon di ASTAS.';return;}
  if(!SR){send('','Browser tidak mendukung pengenalan suara.');$('msg').textContent='Browser tidak mendukung pengenalan suara.';return;}
  const r=new SR();r.lang='id-ID';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  let all='',timer=null,hard=null,failed=false;
  const stop=function(){try{r.stop();}catch(e){}};
  const arm=function(ms){clearTimeout(timer);timer=setTimeout(stop,ms);};
  r.onstart=function(){$('orb').className='on';$('msg').textContent='Silakan bicara… (jeda sebentar untuk selesai)';$('fin').style.display='inline-block';arm(FIRST_MS);hard=setTimeout(stop,MAX_MS);};
  r.onresult=function(e){const L=[];for(let i=0;i<e.results.length;i++)L.push(e.results[i][0].transcript);all=merge(L);$('txt').textContent=all;arm(SILENCE_MS);};
  r.onerror=function(e){failed=true;$('orb').className='';$('fin').style.display='none';
    if(e.error==='not-allowed'){$('msg').textContent='Izin mikrofon ditolak. Ketuk ikon gembok di address bar dan izinkan mikrofon.';send('','Izin mikrofon ditolak.');}
    else if(e.error==='no-speech'){$('msg').textContent='Suara tidak terdengar.';}
    else{$('msg').textContent='Mikrofon gagal: '+e.error;}
    $('again').style.display='inline-block';};
  r.onend=function(){clearTimeout(timer);clearTimeout(hard);$('orb').className='';$('fin').style.display='none';
    if(all){send(all);$('msg').textContent='Terkirim ke ASTAS. Jendela ini akan menutup.';setTimeout(function(){window.close();},400);}
    else if(!failed){$('msg').textContent='Tidak ada suara yang dikenali.';$('again').style.display='inline-block';}};
  $('fin').onclick=stop;
  try{r.start();}catch(e){$('msg').textContent='Mikrofon sedang dipakai.';$('again').style.display='inline-block';}
}
$('again').onclick=start;start();
</script></body></html>
