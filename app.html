<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Fish Farmer + ASTAS</title>
<style>
html,body{margin:0;height:100%;background:#1e3a8a;font-family:system-ui,sans-serif}
#f{position:fixed;top:0;left:0;width:100%;height:calc(100% - 62px - env(safe-area-inset-bottom,0px));border:0;background:#fff}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px);background:#1e3a8a;color:#fff;display:flex;align-items:center;gap:10px;box-sizing:border-box}
#b{flex:none;border:2px solid #fff;border-radius:99px;background:#64748b;color:#fff;font-weight:900;font-size:13px;padding:10px 14px}
#b.on{background:#059669}#b.sp{background:#b45309}
#t{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;max-height:44px}
#g{flex:none;border:0;background:none;color:#fff;font-size:18px}
#setup{display:none;position:fixed;inset:0;z-index:9;background:#1e3a8a;color:#fff;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px}
#setup input{width:100%;max-width:420px;padding:12px;border-radius:10px;border:0;font-size:15px;box-sizing:border-box}
#setup button{padding:12px 24px;border-radius:99px;border:0;background:#fbbf24;font-weight:900}
</style></head><body>
<iframe id="f"></iframe>
<div id="setup"><b style="font-size:18px">Tempel link aplikasi (/exec)</b>
<small>Apps Script &gt; Terapkan &gt; Kelola deployment &gt; URL aplikasi web. Cukup sekali.</small>
<input id="u" placeholder="https://script.google.com/macros/s/.../exec">
<button onclick="simpan()">SIMPAN &amp; BUKA</button><div id="err" style="color:#fecaca;font-size:13px"></div></div>
<div id="bar"><button id="b" onclick="toggle()">🎙️ STANDBY MATI</button><button id="g" onclick="ganti()" aria-label="Ganti link">⚙️</button><div id="t">Tekan tombol untuk mengaktifkan ASTAS.</div></div>
<script>
var RE=/^https:\/\/script\.google\.com\/.+\/exec$/;
function ls(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
var EXEC=(new URLSearchParams(location.search).get('u')||ls('sff_exec')).trim();
var sid=Math.random().toString(36).slice(2,12),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,on=false,paused=false,fs=null,wl=null,b=document.getElementById('b'),t=document.getElementById('t');
function pasang(){if(!RE.test(EXEC)){document.getElementById('setup').style.display='flex';return;}
  try{localStorage.setItem('sff_exec',EXEC);}catch(e){}document.getElementById('setup').style.display='none';
  document.getElementById('f').src=EXEC+'?sid='+sid;}
function simpan(){EXEC=document.getElementById('u').value.trim();if(!RE.test(EXEC)){document.getElementById('err').textContent='Link harus berakhiran /exec';return;}pasang();}
function ganti(){document.getElementById('u').value=EXEC;document.getElementById('setup').style.display='flex';}
function ui(){b.className=paused?'sp':(on?'on':'');b.textContent=paused?'🔈 ASTAS BICARA':(on?'🎙️ STANDBY AKTIF':'🎙️ STANDBY MATI');}
function send(x){if(!x)return;t.textContent='Terkirim: '+x;var u=EXEC+'?sid='+sid+'&cmd='+encodeURIComponent(x);
  fetch(u,{mode:'no-cors'}).catch(function(){new Image().src=u;});}
function start(){
  if(!on||paused||!SR)return;try{rec&&rec.abort();}catch(e){}
  rec=new SR();rec.lang='id-ID';rec.continuous=true;rec.interimResults=true;
  rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++){var s=e.results[i][0].transcript.trim();if(e.results[i].isFinal)send(s);else t.textContent='... '+s;}};
  rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;ui();t.textContent='Mikrofon belum diizinkan di Chrome.';}};
  rec.onend=function(){if(on&&!paused)setTimeout(start,300);};
  try{rec.start();}catch(e){}
}
function toggle(){
  if(!SR){t.textContent='Gunakan Chrome.';return;}
  on=!on;paused=false;ui();
  if(on){t.textContent='Standby aktif. Ucapkan perintah.';start();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(l){wl=l;});}catch(e){}}
  else{t.textContent='Standby dimatikan.';try{rec.abort();}catch(e){}try{wl&&wl.release();}catch(e){}}
}
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='astas-speaking')return;clearTimeout(fs);
  if(e.data.on){paused=true;ui();try{rec.abort();}catch(x){}fs=setTimeout(function(){paused=false;ui();start();},40000);}
  else{paused=false;ui();if(on)setTimeout(start,500);}
});
pasang();
</script></body></html>
