<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTAS Mic</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1e3a8a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:16px;box-sizing:border-box}
button{width:150px;height:150px;border-radius:50%;border:6px solid #fff;background:#64748b;color:#fff;font-size:18px;font-weight:900;cursor:pointer;line-height:1.3}
button.on{background:#059669;animation:p 1.6s infinite}
button.sp{background:#b45309;animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(5,150,105,.6)}100%{box-shadow:0 0 0 30px rgba(5,150,105,0)}}
#t{margin-top:20px;font-size:18px;font-weight:700;min-height:56px}
small{opacity:.75;margin-top:10px}
</style></head><body>
<h2>🎙️ ASTAS Mic</h2>
<button id="b" onclick="toggle()">STANDBY<br>MATI</button>
<div id="t">Tekan tombol untuk mengaktifkan standby.</div>
<small>Setelah aktif, ASTAS terus mendengarkan. Biarkan jendela ini terbuka (boleh diperkecil).</small>
<script>
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,on=false,paused=false,failsafe=null;
var b=document.getElementById('b'),t=document.getElementById('t');
function ui(){
  b.className=paused?'sp':(on?'on':'');
  b.innerHTML=paused?'ASTAS<br>BICARA':(on?'STANDBY<br>AKTIF':'STANDBY<br>MATI');
}
function send(txt){
  if(!txt) return;
  if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'astas',text:txt},'*');t.textContent='Terkirim: '+txt;}
  else t.textContent='Aplikasi utama tidak ditemukan. Buka ulang dari tombol ASTAS.';
}
function start(){
  if(!on||paused||!SR) return;
  try{rec&&rec.abort();}catch(e){}
  rec=new SR();rec.lang='id-ID';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      var tr=e.results[i][0].transcript.trim();
      if(e.results[i].isFinal) send(tr); else t.textContent='... '+tr;
    }
  };
  rec.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;ui();t.textContent='Mikrofon belum diizinkan. Klik ikon gembok di address bar, izinkan mikrofon, lalu tekan tombol.';}
  };
  rec.onend=function(){ if(on&&!paused) setTimeout(start,300); };
  try{rec.start();}catch(e){}
}
function toggle(){
  if(!SR){t.textContent='Browser tidak mendukung. Gunakan Chrome.';return;}
  on=!on;paused=false;ui();
  if(on){t.textContent='Standby aktif. Silakan ucapkan perintah.';start();}
  else{t.textContent='Standby dimatikan.';try{rec.abort();}catch(e){}}
}
/* Saat ASTAS berbicara, mic dijeda agar suaranya tidak terdengar sebagai perintah */
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='astas-speaking') return;
  clearTimeout(failsafe);
  if(e.data.on){ paused=true;ui();try{rec.abort();}catch(x){} failsafe=setTimeout(function(){paused=false;ui();start();},40000); }
  else{ paused=false;ui(); if(on) setTimeout(start,500); }
});
window.addEventListener('load',function(){ if(SR){on=true;ui();t.textContent='Standby aktif. Silakan ucapkan perintah.';start();} });
</script></body></html>
