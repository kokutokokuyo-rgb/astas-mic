<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>ASTAS</title></head>
<body><div id="ld" style="font-family:system-ui,sans-serif;padding:24px;color:#475569">Memuat ASTAS…</div>
<script>
/* catat.html: pemuat ASTAS Catat.
   Mengambil astas-index.html (salinan asli Index.html ASTAS, tanpa diubah), memasang semua penyesuaian
   (server SFF, tema terang, satu mikrofon, perapian) secara otomatis, lalu menampilkannya. */
(function(){
  var ORIGINAL = 'astas-index.html';
  var GAS = 'https://script.google.com/macros/s/AKfycbxiywEW0OFsOvtyD_fTs-kB22wZXvBH8aCOkVWcZ7vLiyZsSZmq50rly4wGwc7POYgYUA/exec';

  var HEAD = '<script>window.GAS_EXEC=\'' + GAS + '\';if(\'serviceWorker\' in navigator)navigator.serviceWorker.register(\'sw.js\');<\/script><script src="gas-shim.js"><\/script>';

  var CSS = '<style>' + [
    ':root{--navy:#f4f2ec;--card:#ffffff;--txt:#12201f;--mut:#5c6b69;--aqua:#0f766e;--cyan:#0f766e;--ok:#2f7d4f;--warn:#b45309;--bad:#c2410c}',
    'body{background:#f4f2ec;max-width:none;font-family:Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.005em}',
    'label:has(#hf){display:none}header{padding:10px 16px}h1{font-size:17px;font-weight:700;letter-spacing:-.01em}header>div:first-child small{display:none}',
    '.u,.act,.yes,#mic{color:#fff!important}button{border:1px solid #e3dfd3}.u,.act,.yes,#mic{border-color:transparent}',
    '#nav{gap:2px;padding:0 16px;border-bottom:1px solid #e3dfd3}#nav button{background:transparent!important;border:0;border-radius:0;border-bottom:2px solid transparent;padding:10px 14px;color:#5c6b69!important;font-weight:600}',
    '#nav button.act{color:#0f766e!important;border-bottom-color:#0f766e}',
    '.m{max-width:78%;font-size:15px}.u{background:#0f766e;border-radius:16px 16px 4px 16px}',
    '.m.b{background:#fff;border:1px solid #e3dfd3;border-radius:16px 16px 16px 4px;box-shadow:none}',
    '#txt{border-radius:14px;border-color:#d8d3c4}#send,#cam{border-radius:12px}#mic{border-radius:14px;background:#0f766e}#mic.on{background:#c2410c}',
    '#quick button{border-radius:999px;background:#fff}',
    '.pc,.card{background:#fff;border:1px solid #e3dfd3;border-radius:14px}.in{border-color:#d8d3c4}',
    'th,td,.krow,.trow{border-color:#e3dfd3}.krow,.trow{color:#334155}#ccv{background:#e9e5d9}',
    '.chip{background:#ece8dc;color:#334155}.chip.ok{background:#dcefe3;color:#14532d}.chip.warn{background:#fbead6;color:#92400e}.alert{background:#fff4e8;color:#7c2d12}',
    '#avatar .bgc{fill:#e7f1ee;stroke:#0f766e}',
    '#orb{width:104px!important;height:104px!important}#stage{padding:4px 16px}#state{margin:2px 0 0;font-size:12px}',
    /* Saat percakapan berjalan: avatar mengecil ke kiri atas, di dalam header */
    'body.chatting #stage{position:fixed;top:5px;left:12px;z-index:20;padding:0;width:auto}',
    'body.chatting #orb{width:46px!important;height:46px!important}body.chatting #state{display:none}body.chatting header h1{margin-left:56px}'
  ].join('') + '</style>';

  var TAIL =
    "$('splash').style.display='none';\n" +
    "window.astasVoice=function(t){const s=String(t).toLowerCase();\n" +
    " if(/^(catat|catatan|mencatat)$/.test(s)){show('chat');const m='Silakan sebutkan yang ingin dicatat, misalnya: catat pakan kolam 1 sebanyak 2 kilogram.';add(m,'b');speak(m);return;}\n" +
    " if(/^(buka |tampilkan )?dashboard/.test(s)){show('dash');return;}\n" +
    " if(/^(buka |tampilkan )?siklus/.test(s)){show('life');return;}\n" +
    " if(/^(buka |tampilkan )?hitung ikan/.test(s)){show('cnt');return;}\n" +
    " show('chat');if(!busy)ask(t);};\n" +
    "if(window.parent!==window&&window.parent.astasOpen){\n" +
    " $('mic').onclick=function(){window.parent.astasOpen();};\n" +
    " setInterval(function(){try{$('mic').classList.toggle('on',!!window.parent.__astasIsOn());}catch(e){}},700);\n" +
    "}\n";

  function rep(h, a, b, miss, name){
    if(h.indexOf(a) < 0){ miss.push(name); return h; }
    return h.replace(a, function(){ return b; });
  }
  function patch(h, miss){
    h = rep(h, '<head>', '<head>' + HEAD, miss, 'head');
    if(/const MIC_URL='[^']*';/.test(h)) h = h.replace(/const MIC_URL='[^']*';/, function(){ return "const MIC_URL='';"; }); else miss.push('MIC_URL');
    h = rep(h, "u.onend=u.onerror=()=>res();setState('speaking');speechSynthesis.speak(u);",
      "const PZ=window.parent!==window?window.parent.__astasPause:null;PZ&&PZ(true);u.onend=u.onerror=()=>{PZ&&PZ(false);res();};setState('speaking');speechSynthesis.speak(u);", miss, 'speak');
    h = rep(h, "d.className='m '+cls;d.textContent=t;",
      "d.className='m '+cls;d.textContent=/^b/.test(cls)?String(t).replace(/\\*\\*|__/g,'').replace(/^\\s*\\*\\s+/gm,'\\u2022 '):t;", miss, 'add');
    h = rep(h, '</head>', CSS + '</head>', miss, 'css');
    var i = h.lastIndexOf('<\/script>');
    if(i < 0) miss.push('script'); else h = h.slice(0, i) + TAIL + h.slice(i);
    return h;
  }

  try{
    var x = new XMLHttpRequest();
    x.open('GET', ORIGINAL + '?v=' + Date.now(), false);
    x.send();
    if(x.status !== 200) throw new Error('file ' + ORIGINAL + ' tidak ditemukan (HTTP ' + x.status + ')');
    var miss = [], html = patch(x.responseText, miss);
    if(miss.length) console.warn('catat.html: bagian tidak cocok dan dilewati:', miss.join(', '));
    var ld = document.getElementById('ld'); if(ld) ld.parentNode.removeChild(ld);
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.innerHTML = '<p style="color:#b91c1c;font-weight:700">Gagal memuat ASTAS: ' + e.message + '</p><p>Pastikan file astas-index.html ada di repo (salinan Index.html ASTAS).</p>';
  }
})();
</script></body></html>
